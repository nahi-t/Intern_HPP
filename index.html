<!DOCTYPE html>
<html>
<body>
    <h2>Test Hero Upload</h2>
    <form id="heroForm">
        <input type="text" name="titleLine1" placeholder="Title 1" required><br><br>
        <input type="text" name="titleLine2" placeholder="Title 2" required><br><br>
        <input type="text" name="subtitle" placeholder="Subtitle" required><br><br>
        
        <!-- THIS 'name' ATTRIBUTE MUST BE 'file' -->
        <input type="file" name="file" required><br><br>
        
        <button type="submit">Submit Hero</button>
    </form>

    <script>
        const form = document.getElementById('heroForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // FormData automatically sets the correct "multipart/form-data" content-type
            const formData = new FormData(form);

            try {
                const response = await fetch('http://localhost:3000/api/hero/create', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();
                console.log('Success:', result);
                alert('Check the console for the response!');
            } catch (error) {
                console.error('Error:', error);
                alert('Upload failed! Check the browser console.');
            }
        });
    </script>
</body>
</html>
