version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: harari_prison_db
    environment:
      POSTGRES_USER: harari_user
      POSTGRES_PASSWORD: harari_password
      POSTGRES_DB: harari_prison
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harari_prison_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://harari_user:harari_password@db:5432/harari_prison?schema=public
      JWT_SECRET: your_super_secret_jwt_key
      PORT: 3000
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: harari_prison_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
